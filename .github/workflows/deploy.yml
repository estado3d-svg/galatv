name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prepare files
        run: |
          mkdir -p /tmp/deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.gitignore' ./ /tmp/deploy/
          echo "=== Archivos a subir ==="
          find /tmp/deploy -type f | sort
          echo "=== Cantidad de archivos ==="
          find /tmp/deploy -type f | wc -l

      - name: Deploy to FTP (explicit TLS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          echo "=== Conectando a $FTP_SERVER en $FTP_DIR ==="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 1
          cd "$FTP_DIR"
          pwd
          mirror -R --verbose /tmp/deploy ./
          bye
          EOF
          echo "=== Resultado: $? ==="
