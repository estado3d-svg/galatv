name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp curl

      - name: Deploy to FTP
        run: |
          echo "Deploying to FTP..."
          echo "Server: ${{ secrets.FTP_SERVER }}"
          echo "Directory: ${{ secrets.FTP_DIR }}"
          
          # Crear carpeta temporal
          mkdir -p /tmp/galatv-deploy
          cp -r . /tmp/galatv-deploy/ --exclude='.git' --exclude='.github' --exclude='node_modules'

          # Conectar a FTPS
          echo "Connecting to FTPS server..."
          lftp -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate false; \
                 set ftps-wrapper-command openssl s_client -connect ${{ secrets.FTP_SERVER }}:21 -quiet; \
                 open ${{ secrets.FTP_SERVER }}; \
                 cd ${{ secrets.FTP_DIR }}; \
                 mirror /tmp/galatv-deploy / -R; \
                 bye" <<EOF
          set ssl:verify-certificate false
          set ftps-wrapper-command openssl s_client -connect ${{ secrets.FTP_SERVER }}:21 -quiet
          open ${{ secrets.FTP_SERVER }}
          cd ${{ secrets.FTP_DIR }}
          mirror /tmp/galatv-deploy / -R
          bye
          EOF
