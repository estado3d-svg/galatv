name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to FTP
        run: |
          echo "Starting FTP deployment..."
          
          # Crear carpeta temporal
          mkdir -p /tmp/galatv-deploy
          cp -r . /tmp/galatv-deploy/ --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.env*'
          
          # Conectar a FTPS
          lftp -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate false; open ${{ secrets.FTP_SERVER }}; cd ${{ secrets.FTP_DIR }}; mirror /tmp/galatv-deploy / -R; bye"
