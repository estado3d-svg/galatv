name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy to FTP
        run: |
          echo "Deploying to ${{ secrets.FTP_SERVER }}..."
          
          mkdir -p /tmp/deploy
          cp -r . /tmp/deploy/ --exclude='.git' --exclude='.github' --exclude='node_modules'
          
          lftp -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate false; \
                 set ftps-wrapper-command openssl s_client -connect ${{ secrets.FTP_SERVER }}:21 -quiet; \
                 open ${{ secrets.FTP_SERVER }}; \
                 cd ${{ secrets.FTP_DIR }}; \
                 mirror /tmp/deploy / -R; \
                 bye"
